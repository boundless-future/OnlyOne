# DPO 示例配置 — 经典基线,用双 adapter reference
# 用法: onlyone train --config configs/dpo.yaml
model:
  name_or_path: Qwen/Qwen2.5-1.5B
  dtype: bf16
  attn_implementation: sdpa
  load_in_4bit: false
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

data:
  train_path: data/preference_example.jsonl
  template: chatml
  max_len: 1024
  packing: false

train:
  output_dir: runs/dpo_qwen15b
  per_device_batch_size: 2
  gradient_accumulation_steps: 8
  lr: 5.0e-6
  warmup_ratio: 0.05
  max_steps: 500
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 250
  seed: 42
  log_with: none
  run_name: dpo-qwen15b

algo:
  name: dpo               # 换成 simpo 即切换为免 ref 的 SimPO(无需改其他字段)
  dpo_beta: 0.1
  # simpo 参数(name: simpo 时生效):
  # simpo_beta: 2.0
  # simpo_gamma: 0.5
