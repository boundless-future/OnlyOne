[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onlyone"
version = "0.1.0"
description = "Single-GPU LLM alignment framework: SFT / ORPO / DPO / RAFT / GRPO on one card"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=0.34",
    "datasets>=2.20",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.43"]
flash = ["flash-attn>=2.6"]
vllm = ["vllm>=0.9"]
logging = ["wandb>=0.17"]
eval = ["numpy>=1.26"]
math = ["math-verify>=0.7"]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
onlyone = "onlyone.cli:app"

[tool.setuptools.packages.find]
include = ["onlyone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that download models or run training steps",
]
